name: update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: flakeのinputを更新
        # irisDotfilesはprivateでGITHUB_TOKENでは取得できないため対象外
        run: |
          nix flake update nixpkgs nix-darwin home-manager 2>&1 | tee -a "$RUNNER_TEMP/summary.txt"
      - name: 自作パッケージを更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for script in nix/packages/*/update.sh; do
            name="$(basename "$(dirname "$script")")"
            before="$(jq -r .version "$(dirname "$script")/source.json")"
            "$script"
            after="$(jq -r .version "$(dirname "$script")/source.json")"
            if [ "$before" != "$after" ]; then
              echo "• Updated package '$name': $before → $after" >>"$RUNNER_TEMP/summary.txt"
            fi
          done
      - name: PR本文を作成
        id: body
        run: |
          {
            echo 'text<<EOF'
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
            echo EOF
          } >>"$GITHUB_OUTPUT"
      # 固定ブランチにforce pushするので、PRは1つのまま更新されていく
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update/deps
          delete-branch: true
          commit-message: 依存関係を更新
          title: 依存関係を更新
          body: ${{ steps.body.outputs.text }}
